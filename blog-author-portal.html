<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Blog Author Portal</title>

<link rel="stylesheet"
href="blog-author-portal.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>
<body>

<div class="login-panel">

    <h2>Staff Login</h2>

    <input id="email"
    placeholder="Email">

    <input
    id="password"
    type="password"
    placeholder="Password">

    <button onclick="login()">
        Login
    </button>

</div>

<div
id="editor"
class="editor hidden">

    <h2>Create Blog</h2>

    <input
    id="title"
    placeholder="Title">

    <input
    id="excerpt"
    placeholder="Excerpt">

    <textarea
    id="content"
    rows="16"
    placeholder="Article HTML">
    </textarea>

    <button onclick="publishBlog()">
        Publish
    </button>

</div>

<script src="blog-author-portal.js"></script>

</body>
</html>
