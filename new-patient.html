<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Patient Consultation | Orthodontic Associates</title>
    <link rel="stylesheet" href="new-patient.css">
</head>
<body>
    <header class="top-header">
        <h1>Orthodontic Associates of New England</h1>
        <p>Call us directly for a free consultation: <strong>(555) 123-4567</strong></p>
    </header>

    <main class="form-container">
        <h2>Request a Free Consultation</h2>
        <p>Fill out the form below and our office will contact you to set up your account and initial appointment.</p>
        
        <form id="newPatientForm">
            <div class="input-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="Jane Doe">
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="jane@example.com">
            </div>
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="(555) 000-0000">
            </div>
            <div class="input-group">
                <label for="notes">How can we help you?</label>
                <textarea id="notes" rows="4" placeholder="Briefly describe your orthodontic needs..."></textarea>
            </div>
            <button type="submit" class="primary-btn">Request Consultation</button>
        </form>
        <div id="formMessage" class="hidden">Thank you! Our team will reach out shortly.</div>
    </main>

    <script type="module" src="new-patient.js"></script>
</body>
</html>
